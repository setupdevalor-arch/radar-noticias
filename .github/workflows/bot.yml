name: Radar Financeiro Telegram Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: radar-financeiro-bot-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  executar-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Garantir Existência do Arquivo de Histórico
        run: |
          if [ ! -f historico_enviados.json ]; then
            echo '{"links": [], "titulos": []}' > historico_enviados.json
          fi

      - name: Executar Bot de Notícias Financeiras
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Persistir Histórico de Links no Repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico_enviados.json
          if git diff --staged --quiet; then
            echo "Nenhuma alteração no histórico para commitar."
          else
            git commit -m "chore(state): atualiza historico_enviados.json [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
