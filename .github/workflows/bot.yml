name: Radar Notícias em Tempo Real

on:
  push:
    branches:
      - main
    paths:
      - 'bot.py'
      - 'requirements.txt'
      - '.github/workflows/bot.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: radar-continuo
  cancel-in-progress: false

jobs:
  enviar-noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python com Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências (httpx, trafilatura, yt-dlp)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar Robô a cada 5 minutos sem pegar fila
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in $(seq 1 18); do
            echo "=== Disparo $i de 18 (Ciclo de 5 min) ==="
            git pull --rebase origin main || true

            # Executa o bot registrando falhas críticas caso ocorram
            python bot.py || echo "Aviso: O ciclo $i retornou erro."

            # Salva e envia o histórico atualizado caso novas notícias tenham saído
            if [ -n "$(git status --porcelain historico_enviados.json)" ]; then
              git add historico_enviados.json
              git commit -m "Atualiza histórico [skip ci]" || true
              git pull --rebase -X theirs origin main || true
              git push origin main || true
            fi

            if [ "$i" -lt 18 ]; then
              echo "Aguardando 5 minutos para o próximo ciclo..."
              sleep 300
            fi
          done
