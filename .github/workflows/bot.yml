name: Radar Notícias em Tempo Real

on:
  schedule:
    # Dispara a cada 5 minutos automaticamente
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  enviar-noticias:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar Robô de Notícias
        run: |
          python bot.py

      - name: Salvar Histórico de Notícias Enviadas
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualizar histórico de notícias enviadas [skip ci]"
          file_pattern: "historico_enviados.json"
